spring.application.name=dysight-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dysightdb}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

server.address=0.0.0.0

server.port=${PORT:8080}


# Configuración de correo DySight
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Configuración de Shelly Cloud
shelly.cloud.server=${SHELLY_CLOUD_SERVER:https://shelly-297-eu.shelly.cloud}
shelly.cloud.auth-key=${SHELLY_CLOUD_AUTH_KEY:}
shelly.cloud.device-id=${SHELLY_CLOUD_DEVICE_ID:}

# Configuración MQTT - EMQX Cloud
mqtt.broker-url=${MQTT_BROKER_URL:ssl://q7ffe41b.ala.us-east-1.emqxsl.com:8883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.client-id=${MQTT_CLIENT_ID:dysight-backend-local}